<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" width="100%" height="100%" style="background-color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2d3748" />
    </marker>
  </defs>

  <!-- Title Section 1 -->
  <text x="450" y="40" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c5282">Lógica de Excepciones y Validación (Ej: recursiva(n))</text>

  <!-- Start -->
  <rect x="350" y="70" width="200" height="40" rx="20" fill="#e2e8f0" stroke="#4a5568" stroke-width="2"/>
  <text x="450" y="95" text-anchor="middle" font-size="14" font-weight="bold">Inicio recursiva(n)</text>

  <line x1="450" y1="110" x2="450" y2="140" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decision 1 -->
  <polygon points="450,140 600,180 450,220 300,180" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="450" y="175" text-anchor="middle" font-size="12">¿n no es int</text>
  <text x="450" y="190" text-anchor="middle" font-size="12">o es bool?</text>

  <!-- Yes branch 1 -->
  <line x1="600" y1="180" x2="720" y2="180" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="170" font-size="12" font-weight="bold" fill="#c53030">Sí</text>
  <rect x="720" y="160" width="140" height="40" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="790" y="185" text-anchor="middle" font-size="12" fill="#c53030">raise TypeError</text>

  <!-- No branch 1 -->
  <line x1="450" y1="220" x2="450" y2="250" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="235" font-size="12" font-weight="bold" fill="#2f855a">No</text>

  <!-- Decision 2 -->
  <polygon points="450,250 600,290 450,330 300,290" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="450" y="295" text-anchor="middle" font-size="12">¿n &lt; 0?</text>

  <!-- Yes branch 2 -->
  <line x1="600" y1="290" x2="720" y2="290" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="280" font-size="12" font-weight="bold" fill="#c53030">Sí</text>
  <rect x="720" y="270" width="140" height="40" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="790" y="295" text-anchor="middle" font-size="12" fill="#c53030">raise ValueError</text>

  <!-- No branch 2 -->
  <line x1="450" y1="330" x2="450" y2="360" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="345" font-size="12" font-weight="bold" fill="#2f855a">No</text>

  <!-- Decision 3 (Base Case) -->
  <polygon points="450,360 600,400 450,440 300,400" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="450" y="405" text-anchor="middle" font-size="12">¿n == 0?</text>

  <!-- Yes Base Case -->
  <line x1="600" y1="400" x2="720" y2="400" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="390" font-size="12" font-weight="bold" fill="#2f855a">Sí</text>
  <rect x="720" y="380" width="140" height="40" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="790" y="405" text-anchor="middle" font-size="12" fill="#276749">Return "Done"</text>

  <!-- Recursive Step -->
  <line x1="450" y1="440" x2="450" y2="470" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="455" font-size="12" font-weight="bold" fill="#c53030">No</text>

  <rect x="330" y="470" width="240" height="40" rx="6" fill="#f7fafc" stroke="#4a5568" stroke-width="2"/>
  <text x="450" y="495" text-anchor="middle" font-size="12">print(n) &amp; recursiva(n - 1)</text>

  <!-- Catch Block Connection -->
  <path d="M 790 200 L 790 530 L 450 530" fill="none" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="4" marker-end="url(#arrow)"/>
  <path d="M 790 310 L 790 530" fill="none" stroke="#e53e3e" stroke-width="1.5" stroke-dasharray="4"/>

  <rect x="330" y="550" width="240" height="40" rx="6" fill="#fff5f5" stroke="#e53e3e" stroke-width="2"/>
  <text x="450" y="575" text-anchor="middle" font-size="12" fill="#c53030">except: Imprimir error y return None</text>

  <line x1="450" y1="510" x2="450" y2="610" stroke="#2d3748" stroke-width="2"/>
  <line x1="790" y1="420" x2="790" y2="610" stroke="#2d3748" stroke-width="2"/>
  <line x1="450" y1="590" x2="450" y2="610" stroke="#2d3748" stroke-width="2"/>
  <line x1="450" y1="610" x2="790" y2="610" stroke="#2d3748" stroke-width="2"/>

  <!-- End Sub-function -->
  <line x1="620" y1="610" x2="620" y2="640" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="520" y="640" width="200" height="40" rx="20" fill="#e2e8f0" stroke="#4a5568" stroke-width="2"/>
  <text x="620" y="665" text-anchor="middle" font-size="14" font-weight="bold">Fin Función</text>

  <!-- Section 2: Aplanar JSON -->
  <line x1="50" y1="710" x2="850" y2="710" stroke="#cbd5e0" stroke-width="2"/>

  <text x="450" y="750" text-anchor="middle" font-size="20" font-weight="bold" fill="#2c5282">Procesamiento Recursivo: aplanar_json</text>

  <rect x="350" y="780" width="200" height="40" rx="20" fill="#e2e8f0" stroke="#4a5568" stroke-width="2"/>
  <text x="450" y="805" text-anchor="middle" font-size="14" font-weight="bold">Inicio aplanar_json</text>

  <line x1="450" y1="820" x2="450" y2="850" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Branch Data Types -->
  <polygon points="450,850 600,890 450,930 300,890" fill="#fffaf0" stroke="#dd6b20" stroke-width="2"/>
  <text x="450" y="885" text-anchor="middle" font-size="12">¿Tipo de estructura?</text>

  <!-- List/Dict -->
  <line x1="300" y1="890" x2="180" y2="890" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="220" y="880" font-size="12" font-weight="bold" fill="#2b6cb0">dict o list</text>

  <rect x="50" y="870" width="130" height="40" rx="6" fill="#ebf8ff" stroke="#3182ce" stroke-width="2"/>
  <text x="115" y="895" text-anchor="middle" font-size="11">Obtener iterador</text>

  <!-- Primitive -->
  <line x1="600" y1="890" x2="720" y2="890" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="880" font-size="12" font-weight="bold" fill="#718096">Otro / Primitivo</text>

  <rect x="720" y="870" width="150" height="40" rx="6" fill="#f0fff4" stroke="#38a169" stroke-width="2"/>
  <text x="795" y="895" text-anchor="middle" font-size="11" fill="#276749">Return {clave: valor}</text>

  <!-- Loop Processing -->
  <line x1="115" y1="910" x2="115" y2="960" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="25" y="960" width="180" height="50" rx="6" fill="#ffffff" stroke="#4a5568" stroke-width="2"/>
  <text x="115" y="982" text-anchor="middle" font-size="11">Iterar elementos y</text>
  <text x="115" y="997" text-anchor="middle" font-size="11">llamar aplanar_json()</text>

  <line x1="205" y1="985" x2="350" y2="985" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="350" y="960" width="200" height="50" rx="6" fill="#edf2f7" stroke="#4a5568" stroke-width="2"/>
  <text x="450" y="982" text-anchor="middle" font-size="11">Validar colisiones de claves</text>
  <text x="450" y="997" text-anchor="middle" font-size="11">y construir 'resultado'</text>

  <line x1="550" y1="985" x2="620" y2="985" stroke="#2d3748" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="620" y="965" width="160" height="40" rx="20" fill="#e2e8f0" stroke="#4a5568" stroke-width="2"/>
  <text x="700" y="990" text-anchor="middle" font-size="13" font-weight="bold">Return resultado</text>
</svg>
